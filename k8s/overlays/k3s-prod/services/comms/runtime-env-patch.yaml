apiVersion: apps/v1
kind: Deployment
metadata:
  name: nem-comms
  namespace: nem-apps
spec:
  template:
    spec:
      containers:
        - name: nem-comms
          image: localhost/nem.comms:74f8e12
          imagePullPolicy: Never
          env:
            - name: Channels__Telegram__WebhookUrl
              value: https://nem.endorff.net/api/comms/api/v1/webhook/telegram
            - name: OpenBao__Address
              value: http://openbao.platform-security.svc.cluster.local:8200
            - name: NemConfiguration__ServiceUrl
              value: http://nem-configuration:8080
            - name: NemConfiguration__TokenEndpoint
              value: http://keycloak.platform-identity.svc.cluster.local:8080/auth/realms/nem/protocol/openid-connect/token
            - name: NemConfiguration__ClientId
              value: nem-comms-configuration
            - name: NemConfiguration__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: nem-comms-configuration-secret
                  key: NemConfiguration__ClientSecret
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: Observability__ServiceName
              value: nem.Comms.Api
            - name: Keycloak__Authority
              value: https://nem.endorff.net:8448/auth/realms/nem
            - name: Keycloak__MetadataAddress
              value: http://keycloak.platform-identity.svc.cluster.local:8080/auth/realms/nem/.well-known/openid-configuration
            - name: Keycloak__RequireHttpsMetadata
              value: "false"
            - name: Keycloak__Audience
              value: nem-comms-api
            - name: DataProtection__KeyDirectory
              value: /var/lib/nem-comms/data-protection
            - name: DataProtection__CertificatePath
              value: /etc/nem-comms/data-protection/tls.crt
            - name: DataProtection__CertificateKeyPath
              value: /etc/nem-comms/data-protection/tls.key
          volumeMounts:
            - name: data-protection-keys
              mountPath: /var/lib/nem-comms/data-protection
            - name: data-protection-certificate
              mountPath: /etc/nem-comms/data-protection
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 5280
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5280
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data-protection-keys
          persistentVolumeClaim:
            claimName: nem-comms-data-protection
        - name: data-protection-certificate
          secret:
            secretName: nem-comms-configuration-secret
            defaultMode: 0400
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key

apiVersion: v1
kind: Service
metadata:
  name: nem-comms
  namespace: nem-apps
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "5280"
spec:
  type: ClusterIP
  ports:
    - port: 5280
      targetPort: 5280
      protocol: TCP
  selector:
    app: nem-comms

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - ../../../base/infrastructure/tempo
  - ../../../base/infrastructure/otel-collector
  - grafana-provisioning.yaml

patches:
  - path: tempo-config-patch.yaml
    target:
      kind: ConfigMap
      name: tempo-config
  - path: otel-collector-config-patch.yaml
    target:
      kind: ConfigMap
      name: otel-collector-config
  - path: tempo-pvc-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: tempo-data
  - path: otel-collector-pvc-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: otel-collector-storage
  - path: otel-collector-service-patch.yaml
    target:
      kind: Service
      name: otel-collector

apiVersion: v1
kind: ConfigMap
metadata:
  name: nem-configuration-config
  namespace: nem
  labels:
    app: nem-configuration
data:
  Logging__LogLevel__Default: Information
  Logging__LogLevel__Microsoft.AspNetCore: Warning
  ASPNETCORE_ENVIRONMENT: Development
  CORS__AllowedOrigins: http://nem-web:3000,http://nem-mcp:8080
  Tenancy__TrustedTenantOverrideServicePrincipals__0: nem-scheduler-configuration
  Tenancy__TrustedTenantOverrideServicePrincipals__1: nem-comms-configuration
  Observability__Enabled: "true"
  Observability__ServiceNamespace: nem
  Observability__DeploymentEnvironmentName: development
  Observability__TraceSamplingRatio: "1.0"

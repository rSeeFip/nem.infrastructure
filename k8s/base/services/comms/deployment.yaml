apiVersion: apps/v1
kind: Deployment
metadata:
  name: nem-comms
  namespace: nem
  labels:
    app: nem-comms
    app.kubernetes.io/part-of: nem-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nem-comms
  template:
    metadata:
      labels:
        app: nem-comms
        app.kubernetes.io/part-of: nem-platform
    spec:
      containers:
        - name: nem-comms
          image: localhost:5000/nem-comms:dev
          ports:
            - containerPort: 5280
          envFrom:
            - configMapRef:
                name: nem-comms-config
          env:
            - name: NemConfiguration__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: nem-comms-configuration-secret
                  key: NemConfiguration__ClientSecret
            - name: DataProtection__KeyDirectory
              value: /var/lib/nem-comms/data-protection
            - name: DataProtection__CertificatePath
              value: /etc/nem-comms/data-protection/tls.crt
            - name: DataProtection__CertificateKeyPath
              value: /etc/nem-comms/data-protection/tls.key
          volumeMounts:
            - name: data-protection-keys
              mountPath: /var/lib/nem-comms/data-protection
            - name: data-protection-certificate
              mountPath: /etc/nem-comms/data-protection
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 5280
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: data-protection-keys
          persistentVolumeClaim:
            claimName: nem-comms-data-protection
        - name: data-protection-certificate
          secret:
            secretName: nem-comms-configuration-secret
            defaultMode: 0400
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key

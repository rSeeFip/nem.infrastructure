name: OpenCode

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Task for OpenCode
        required: true
        type: string
      model:
        description: OpenAI model available to the API key
        required: true
        default: openai/gpt-6-astra
        type: string

permissions:
  contents: read

jobs:
  opencode:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run OpenCode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_PROMPT: ${{ inputs.prompt }}
          OPENCODE_MODEL: ${{ inputs.model }}
        run: bash .ci/run-opencode.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-results-${{ github.run_id }}
          path: opencode-results/
          retention-days: 7
          if-no-files-found: warn

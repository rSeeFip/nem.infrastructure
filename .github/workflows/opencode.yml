name: OpenCode

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Task for OpenCode
        required: true
        type: string
      model:
        description: Model available through the Codex account
        required: true
        default: openai/gpt-6-astra
        type: string

permissions:
  contents: read

concurrency:
  group: opencode-codex
  cancel-in-progress: false

jobs:
  opencode:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, opencode]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run OpenCode
        env:
          OPENCODE_PROMPT: ${{ inputs.prompt }}
          OPENCODE_MODEL: ${{ inputs.model }}
          OPENCODE_AUTH_PROFILE: github-nem-infrastructure
        run: bash .ci/run-opencode.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: opencode-results-${{ github.run_id }}
          path: opencode-results/
          retention-days: 7
          if-no-files-found: warn
